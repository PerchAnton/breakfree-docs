[package]
name = "breakfree-docs"
version = "0.1.0-alpha.91"
edition = "2024"
rust-version = "1.88"
description = "Independent Rust document editor with an office ribbon"
repository = "https://github.com/PerchAnton/breakfree-docs"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd", "dep:arboard"]
capture = ["desktop", "eframe/__screenshot"]

[dependencies]
quick-xml = "=0.41.0"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
crc32fast = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
regex = { version = "1.12", default-features = false, features = ["std", "unicode-case"] }
tempfile = "3.23"
eframe = { version = "=0.33.0", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
arboard = { version = "3.6", optional = true, default-features = false }

[[bin]]
name = "breakfree-docs"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true

[[example]]
name = "capture_ui"
required-features = ["capture"]

[[example]]
name = "structured_report"
required-features = ["desktop"]
