name: Standalone editor checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0
      - name: Install this repository only
        run: python -m pip install -e ".[desktop,dev]"
      - name: Require working desktop test imports
        run: python -c "from PySide6.QtWidgets import QApplication; from PySide6.QtTest import QTest; print('Qt desktop imports OK')"
      - name: Lint
        run: python -m ruff check src tests tools
      - name: Formatting
        run: python -m ruff format --check src tests tools
      - name: Document, storage, integration and Qt event-loop tests
        run: python -m unittest discover -s tests -v
      - name: Check local links and artwork
        run: python tools/check_repository.py
      - name: Build standalone distribution
        run: python -m build
      - name: Verify installed wheel outside the repository
        run: python tools/check_wheel.py
